name: Compilar instaladores Windows
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'installer/**'
      - '.github/workflows/build-installers.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar dependencias
        run: dotnet restore src/AdivinaLaPalabra/AdivinaLaPalabra.csproj
      - name: Publicar x86 para Windows 32 bits
        run: dotnet publish src/AdivinaLaPalabra/AdivinaLaPalabra.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/x86
      - name: Publicar x64 para Windows 64 bits
        run: dotnet publish src/AdivinaLaPalabra/AdivinaLaPalabra.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/x64
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Crear instalador x86
        run: iscc /DAPP_ARCH="x86" installer/AdivinaLaPalabra.iss
      - name: Crear instalador x64
        run: iscc /DAPP_ARCH="x64" installer/AdivinaLaPalabra.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Instaladores-AdivinaLaPalabra-Windows
          path: installer-output/*.exe
          if-no-files-found: error